[project]
name = "orng-led-control"
version = "0.2.0"
description = "ORNG LED CONTROL — local DJ lighting console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "PyYAML>=6.0.0",
    "sounddevice>=0.5.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
cloud = [
    "httpx>=0.27.0",
    "websockets>=14.0",
    "cryptography>=43.0.0",
    "keyring>=25.0.0",
]
linux = [
    "evdev>=1.7.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orng_led"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
