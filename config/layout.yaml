schema_version: 1
viewer_facing: true
description: >
  Stage plan drawn from the operator reference sketch (canon §3.3).
  Left/right are from the audience looking at the stage.
  x grows to the audience right, y grows downwards in the stage picture,
  z grows upstage. All coordinates are normalized 0..1 and are PROVISIONAL:
  real trim heights, distances, Bar segment direction and Beam home/invert
  remain PENDING HARDWARE.
fixtures:
  - par_1
  - par_2
  - par_3
  - par_4
  - beam_right
  - beam_left
  - bar_1
  - bar_2
  - bar_3
  - bar_4
  - face_par_1
  - face_par_2

# Physical DMX/Art-Net daisy chain exactly as drawn on the reference sketch.
# Node → bottom PAR row (left → right) → Beams (right → left) →
# Bars (left → right) → top corner PARs (right → left).
cable_chain:
  - par_1
  - par_2
  - par_3
  - par_4
  - beam_right
  - beam_left
  - bar_1
  - bar_2
  - bar_3
  - bar_4
  - face_par_2
  - face_par_1

artnet_node:
  fixture_id: artnet_node
  kind: par
  x: 0.10
  y: 0.94
  z: 0.05
  width: 0.07
  height: 0.035
  orientation: horizontal
  mount: floor
  zone: node
  notes: Art-Net node position from the reference sketch (provisional).

