<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }

        function paint() {
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);

          var R = 255, G = 42, B = 0;
          var pitch = Math.max(5, Math.min(14, Math.round(w / 70)));
          var thin = Math.max(1, Math.round(pitch * 0.18));
          var thick = Math.max(thin + 2, pitch - 2);

          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "middle";
          var fontPx = Math.min(w * 0.34, h * 0.16);
          function font(sz) {
            return "900 " + sz + 'px Impact,"Arial Black",Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 40 && o.measureText("HOTBOX").width > w * 0.9) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var lineGap = fontPx * 0.16;
          var blockH = fontPx * 2 + lineGap;
          var midY = h * 0.32;
          var cx = w * 0.5;
          o.fillText("ORNG", cx, midY - blockH * 0.28);
          o.fillText("HOTBOX", cx, midY + blockH * 0.28);

          var img = o.getImageData(0, 0, w, h);
          var d = img.data;
          for (var i = 0; i < d.length; i += 4) {
            if (d[i] > 40) {
              d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
            } else {
              d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 255;
            }
          }
          o.putImageData(img, 0, 0);

          var invW = 1 / Math.max(1, w - 1);
          ctx.fillStyle = "rgb(" + R + "," + G + "," + B + ")";
          for (var x = (pitch * 0.5) | 0; x < w; x += pitch) {
            if (edgeFade(x * invW, 0.1) < 0.05) continue;
            ctx.fillRect(x - ((thin / 2) | 0), 0, thin, h);
          }

          ctx.imageSmoothingEnabled = false;
          for (var sx = (pitch * 0.5) | 0; sx < w; sx += pitch) {
            if (edgeFade(sx * invW, 0.1) < 0.05) continue;
            ctx.drawImage(off, sx, 0, 1, h, sx - ((thick / 2) | 0), 0, thick, h);
          }

          var padY = Math.max(16, h * 0.07);
          var top = ctx.createLinearGradient(0, 0, 0, padY);
          top.addColorStop(0, "#000");
          top.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = top;
          ctx.fillRect(0, 0, w, padY);
          var bot = ctx.createLinearGradient(0, h - padY, 0, h);
          bot.addColorStop(0, "rgba(0,0,0,0)");
          bot.addColorStop(1, "#000");
          ctx.fillStyle = bot;
          ctx.fillRect(0, h - padY, w, padY);

          var padX = Math.max(20, w * 0.07);
          var left = ctx.createLinearGradient(0, 0, padX, 0);
          left.addColorStop(0, "#000");
          left.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = left;
          ctx.fillRect(0, 0, padX, h);
          var right = ctx.createLinearGradient(w - padX, 0, w, 0);
          right.addColorStop(0, "rgba(0,0,0,0)");
          right.addColorStop(1, "#000");
          ctx.fillStyle = right;
          ctx.fillRect(w - padX, 0, padX, h);
        }

        paint();
        window.addEventListener("resize", paint);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
