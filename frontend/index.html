<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
    </style>
    <link rel="preload" as="image" href="/splash-frames/000.jpg" />
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/splash-frames/000.jpg" alt="" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
