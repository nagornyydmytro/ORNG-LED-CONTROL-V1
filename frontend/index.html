<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }

        function paint() {
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);

          var orange = "#ff3b00";
          var R = 255, G = 59, B = 0;
          var pitch = Math.max(4, Math.round(w / 55));
          var thin = Math.max(1, Math.round(pitch * 0.15));
          var thick = Math.max(thin + 2, pitch - 1);

          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d");
          if (!o) return;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = orange;
          o.textAlign = "center";
          o.textBaseline = "middle";
          var fontPx = Math.min(w * 0.36, h * 0.18);
          function font(sz) {
            return "900 " + sz + 'px Impact,"Arial Black",Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 36 && o.measureText("HOTBOX").width > w * 0.9) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var lineGap = fontPx * 0.18;
          var blockH = fontPx * 2 + lineGap;
          var midY = h * 0.32;
          var cx = w * 0.5;
          o.fillText("ORNG", cx, midY - blockH * 0.28);
          o.fillText("HOTBOX", cx, midY + blockH * 0.28);

          var invW = 1 / Math.max(1, w - 1);
          for (var x = (pitch * 0.5) | 0; x < w; x += pitch) {
            var fx = edgeFade(x * invW, 0.11);
            if (fx < 0.04) continue;
            var grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "rgba(" + R + "," + G + "," + B + ",0)");
            grad.addColorStop(0.08, "rgba(" + R + "," + G + "," + B + "," + 0.85 * fx + ")");
            grad.addColorStop(0.92, "rgba(" + R + "," + G + "," + B + "," + 0.85 * fx + ")");
            grad.addColorStop(1, "rgba(" + R + "," + G + "," + B + ",0)");
            ctx.fillStyle = grad;
            ctx.fillRect(x - ((thin / 2) | 0), 0, thin, h);
          }

          ctx.imageSmoothingEnabled = false;
          for (var sx = (pitch * 0.5) | 0; sx < w; sx += pitch) {
            var fxx = edgeFade(sx * invW, 0.11);
            if (fxx < 0.04) continue;
            ctx.globalAlpha = fxx;
            ctx.drawImage(off, sx, 0, 1, h, sx - ((thick / 2) | 0), 0, thick, h);
          }
          ctx.globalAlpha = 1;

          var edgeWash = ctx.createLinearGradient(0, 0, 0, h);
          edgeWash.addColorStop(0, "#000");
          edgeWash.addColorStop(0.08, "rgba(0,0,0,0)");
          edgeWash.addColorStop(0.92, "rgba(0,0,0,0)");
          edgeWash.addColorStop(1, "#000");
          ctx.fillStyle = edgeWash;
          ctx.fillRect(0, 0, w, h);

          var side = Math.max(24, w * 0.08);
          var left = ctx.createLinearGradient(0, 0, side, 0);
          left.addColorStop(0, "#000");
          left.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = left;
          ctx.fillRect(0, 0, side, h);
          var right = ctx.createLinearGradient(w - side, 0, w, 0);
          right.addColorStop(0, "rgba(0,0,0,0)");
          right.addColorStop(1, "#000");
          ctx.fillStyle = right;
          ctx.fillRect(w - side, 0, side, h);
        }

        paint();
        window.addEventListener("resize", paint);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
