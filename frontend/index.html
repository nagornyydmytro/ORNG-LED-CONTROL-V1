<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="boot-splash"
      aria-hidden="true"
    >
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      /* Immediate Klickpin-style slit cover (mirrors splashStripes.ts). */
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;
        var ORANGE = "#ff4d00";
        var R = 255,
          G = 77,
          B = 0;

        function fade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          function s(a, b, x) {
            var u = Math.max(0, Math.min(1, (x - a) / (b - a)));
            return u * u * (3 - 2 * u);
          }
          return Math.min(s(0, soft, t), s(0, soft, 1 - t));
        }

        function capsule(x, y, w, h) {
          var r = Math.min(w / 2, h / 2);
          ctx.beginPath();
          if (h <= w) {
            ctx.arc(x + w / 2, y + h / 2, r, 0, Math.PI * 2);
          } else {
            ctx.moveTo(x, y + r);
            ctx.arc(x + w / 2, y + r, r, Math.PI, 0);
            ctx.lineTo(x + w, y + h - r);
            ctx.arc(x + w / 2, y + h - r, r, 0, Math.PI);
            ctx.closePath();
          }
          ctx.fill();
        }

        function paint() {
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);

          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = "#fff";
          o.strokeStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "top";
          o.lineJoin = "round";
          var fontPx = Math.min(w * 0.34, h * 0.17);
          function font(sz) {
            return "900 " + sz + 'px "Arial Black",Impact,Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 32 && o.measureText("HOTBOX").width > w * 0.88) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          o.lineWidth = Math.max(4, fontPx * 0.1);
          var gap = fontPx * 0.02;
          var blockH = fontPx * 2 + gap;
          var top = h * 0.3 - blockH * 0.28;
          var cx = w * 0.5;
          o.strokeText("ORNG", cx, top);
          o.fillText("ORNG", cx, top);
          o.strokeText("HOTBOX", cx, top + fontPx + gap);
          o.fillText("HOTBOX", cx, top + fontPx + gap);
          var data = o.getImageData(0, 0, w, h).data;

          var pitch = Math.max(4, Math.round(w / 55));
          var thin = Math.max(1, Math.round(pitch * 0.16));
          var thick = Math.max(thin + 2, Math.round(pitch * 0.52));
          var invW = 1 / Math.max(1, w - 1);
          var invH = 1 / Math.max(1, h - 1);
          var band = Math.max(4, (h / 40) | 0);

          for (var i = 0; i < Math.ceil(w / pitch); i++) {
            var x = (i * pitch + pitch * 0.5) | 0;
            if (x < 0 || x >= w) continue;
            var fadeX = fade(x * invW, 0.1);
            if (fadeX < 0.05) continue;

            for (var y0 = 0; y0 < h; y0 += band) {
              var fadeY = fade((y0 + band * 0.5) * invH, 0.16);
              var a = 0.85 * fadeX * fadeY;
              if (a < 0.03) continue;
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + a + ")";
              ctx.fillRect(x - ((thin / 2) | 0), y0, thin, Math.min(band + 1, h - y0));
            }

            var run = -1;
            function flush(yEnd) {
              if (run < 0) return;
              var yStart = run;
              var hh = yEnd - yStart;
              run = -1;
              if (hh < 2) return;
              var fy = fade(((yStart + yEnd) * 0.5) * invH, 0.16);
              var aa = fadeX * fy;
              if (aa < 0.05) return;
              ctx.globalAlpha = aa;
              ctx.fillStyle = ORANGE;
              capsule(x - ((thick / 2) | 0), yStart, thick, hh);
              ctx.globalAlpha = 1;
            }
            for (var y = 0; y < h; y++) {
              var on = data[(y * w + x) * 4] > 40;
              if (on) {
                if (run < 0) run = y;
              } else flush(y);
            }
            flush(h);
          }
        }

        paint();
        window.addEventListener("resize", paint);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
