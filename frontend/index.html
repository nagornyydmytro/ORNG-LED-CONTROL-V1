<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }

        function paint() {
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);

          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "middle";
          var fontPx = Math.min(w * 0.34, h * 0.17);
          function font(sz) {
            return "900 " + sz + 'px Impact,"Arial Black",Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 32 && o.measureText("HOTBOX").width > w * 0.88) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var lineGap = fontPx * 0.12;
          var blockH = fontPx * 2 + lineGap;
          var blockMidY = h * 0.3 + blockH * 0.15;
          var cx = w * 0.5;
          var y1 = blockMidY - blockH * 0.25;
          var y2 = blockMidY + blockH * 0.25;
          o.fillText("ORNG", cx, y1);
          o.fillText("HOTBOX", cx, y2);
          var smear = Math.max(4, (fontPx * 0.12) | 0);
          o.globalCompositeOperation = "lighter";
          for (var dy = 1; dy <= smear; dy++) {
            var a = 1 - dy / (smear + 1);
            o.globalAlpha = 0.35 * a;
            o.fillText("ORNG", cx, y1 - dy);
            o.fillText("ORNG", cx, y1 + dy);
            o.fillText("HOTBOX", cx, y2 - dy);
            o.fillText("HOTBOX", cx, y2 + dy);
          }
          o.globalAlpha = 1;
          o.globalCompositeOperation = "source-over";

          var data = o.getImageData(0, 0, w, h).data;
          var pitch = Math.max(4, Math.round(w / 55));
          var thin = Math.max(1, Math.round(pitch * 0.12));
          var thick = Math.max(thin + 2, pitch - 1);
          var R = 255, G = 77, B = 0;
          var invW = 1 / Math.max(1, w - 1);
          var invH = 1 / Math.max(1, h - 1);

          for (var col = 0; ; col++) {
            var x = (col * pitch + pitch * 0.5) | 0;
            if (x >= w) break;
            var fadeX = edgeFade(x * invW, 0.1);
            if (fadeX < 0.03) continue;

            var runY = 0;
            var runCov = data[x * 4] / 255;
            function flush(yEnd) {
              if (yEnd <= runY) return;
              var midY = ((runY + yEnd) * 0.5) * invH;
              var fadeY = edgeFade(midY, 0.1);
              var aa = fadeX * fadeY;
              if (aa < 0.03) {
                runY = yEnd;
                return;
              }
              var width = thin + (thick - thin) * Math.min(1, runCov * 1.35);
              var bright = 0.55 + 0.45 * Math.min(1, runCov * 1.2);
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + (aa * bright) + ")";
              ctx.fillRect(x - width * 0.5, runY, width, yEnd - runY);
              runY = yEnd;
            }
            for (var y = 1; y < h; y++) {
              var c = data[(y * w + x) * 4] / 255;
              var q = c > 0.55 ? 1 : c > 0.12 ? 0.35 : 0;
              if (Math.abs(q - runCov) > 0.2) {
                flush(y);
                runCov = q;
              }
            }
            flush(h);
          }
        }

        paint();
        window.addEventListener("resize", paint);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
