<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        // Instant thin-slit field only; Vue paints ORNG/HOTBOX on first frame.
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;
        var w = Math.max(1, window.innerWidth | 0);
        var h = Math.max(1, window.innerHeight | 0);
        canvas.width = w;
        canvas.height = h;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);
        var pitch = Math.max(5, Math.min(14, Math.round(w / 70)));
        var thin = Math.max(2, Math.round(pitch * 0.22));
        ctx.fillStyle = "#ff4d00";
        for (var x = (pitch * 0.5) | 0; x < w; x += pitch) {
          var t = x / Math.max(1, w - 1);
          var edge = Math.min(t / 0.08, (1 - t) / 0.08, 1);
          if (edge < 0.05) continue;
          ctx.globalAlpha = Math.max(0, Math.min(1, edge));
          ctx.fillRect(x - ((thin / 2) | 0), h * 0.08, thin, h * 0.84);
        }
        ctx.globalAlpha = 1;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
