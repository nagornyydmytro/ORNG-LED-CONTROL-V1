<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;
        var coverage = null;
        var cw = 0;
        var ch = 0;
        var raf = 0;
        var t0 = window.__ORNG_SPLASH_T0 || performance.now();

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }

        function rebuildMask(w, h) {
          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return null;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = "#fff";
          o.strokeStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "top";
          o.lineJoin = "round";
          var fontPx = Math.min(w * 0.36, h * 0.14);
          function font(sz) {
            return "900 " + sz + 'px "Arial Black",Impact,Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 28 && o.measureText("HOTBOX").width > w * 0.92) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var gap = fontPx * 0.05;
          var blockH = fontPx * 2 + gap;
          var textTop = h * 0.36 - blockH * 0.5;
          var cx = w * 0.5;
          o.lineWidth = Math.max(4, fontPx * 0.12);
          o.strokeText("ORNG", cx, textTop);
          o.fillText("ORNG", cx, textTop);
          o.strokeText("HOTBOX", cx, textTop + fontPx + gap);
          o.fillText("HOTBOX", cx, textTop + fontPx + gap);
          var img = o.getImageData(0, 0, w, h);
          var d = img.data;
          var cov = new Uint8Array(w * h);
          for (var i = 0, p = 0; i < cov.length; i += 1, p += 4) {
            cov[i] = d[p] > 40 ? 255 : 0;
          }
          return cov;
        }

        function paint(now) {
          if (!document.getElementById("boot-splash")) return;
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          if (w !== cw || h !== ch || !coverage) {
            cw = w;
            ch = h;
            canvas.width = w;
            canvas.height = h;
            coverage = rebuildMask(w, h);
          }
          var timeSec = (now - t0) / 1000;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);
          if (!coverage || w < 8 || h < 8) {
            raf = requestAnimationFrame(paint);
            return;
          }

          var R = 255, G = 77, B = 0;
          var pitch = Math.max(5, Math.min(14, Math.round(w / 70)));
          var thin = Math.max(1, Math.round(pitch * 0.18));
          var thickBase = Math.max(thin + 3, Math.round(pitch * 0.78));
          var invW = 1 / Math.max(1, w - 1);
          var invH = 1 / Math.max(1, h - 1);
          var assemble = smoothstep(0, 0.7, timeSec);
          var morph = timeSec * Math.PI;
          var breath = 0.72 + 0.28 * Math.sin(timeSec * 4.2);
          var flicker = 0.88 + 0.12 * Math.sin(timeSec * 37.0);
          var thick = Math.max(thin + 2, Math.round(thickBase * breath));
          var band = Math.max(3, (h / 50) | 0);

          for (var si = 0; si < Math.ceil(w / pitch) + 1; si += 1) {
            var x = (si * pitch + pitch * 0.5) | 0;
            if (x < 0 || x >= w) continue;
            var fadeX = edgeFade(x * invW, 0.1);
            if (fadeX < 0.04) continue;

            for (var y0 = 0; y0 < h; y0 += band) {
              var fadeY = edgeFade((y0 + band * 0.5) * invH, 0.14);
              var a = fadeX * fadeY * flicker;
              if (a < 0.04) continue;
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + a + ")";
              ctx.fillRect(x - ((thin / 2) | 0), y0, thin, Math.min(band + 1, h - y0));
            }

            var sampleShift = Math.round(
              Math.sin(morph + si * 0.37) * pitch * 3.2 * (0.35 + 0.65 * assemble)
            );
            var sx = Math.max(0, Math.min(w - 1, x + sampleShift));
            var yWave = Math.sin(timeSec * 3.1 + si * 0.51) * h * 0.018;
            var scatter = (1 - assemble) * Math.sin(si * 12.989 + 1.7) * h * 0.16;

            var run = -1;
            function flush(yEnd) {
              if (run < 0) return;
              var yy = run;
              var hh = yEnd - yy;
              run = -1;
              if (hh < 2) return;
              var drawY = Math.round(yy + yWave + scatter);
              if (drawY >= h || drawY + hh <= 0) return;
              var cy = Math.max(0, drawY);
              var chh = Math.min(h, drawY + hh) - cy;
              if (chh < 2) return;
              var fy = edgeFade((cy + chh * 0.5) * invH, 0.14);
              var aa = fadeX * fy * (0.55 + 0.45 * assemble);
              if (aa < 0.05) return;
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + aa + ")";
              ctx.fillRect(x - ((thick / 2) | 0), cy, thick, chh);
            }
            for (var y = 0; y < h; y += 1) {
              if (coverage[y * w + sx] > 0) {
                if (run < 0) run = y;
              } else {
                flush(y);
              }
            }
            flush(h);
          }

          raf = requestAnimationFrame(paint);
        }

        raf = requestAnimationFrame(paint);
        window.addEventListener("resize", function () {
          cw = 0;
          ch = 0;
          coverage = null;
        });
        var obs = new MutationObserver(function () {
          if (!document.getElementById("boot-splash")) {
            cancelAnimationFrame(raf);
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
