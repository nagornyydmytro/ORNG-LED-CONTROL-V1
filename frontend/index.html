<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }

        function paint() {
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);
          if (w < 8 || h < 8) return;

          var R = 255, G = 77, B = 0;
          var pitch = Math.max(5, Math.min(14, Math.round(w / 70)));
          var thin = Math.max(1, Math.round(pitch * 0.15));
          var thick = Math.max(thin + 3, Math.round(pitch * 0.78));

          var off = document.createElement("canvas");
          off.width = w;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return;
          o.fillStyle = "#000";
          o.fillRect(0, 0, w, h);
          o.fillStyle = "#fff";
          o.strokeStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "top";
          o.lineJoin = "round";
          var fontPx = Math.min(w * 0.36, h * 0.14);
          function font(sz) {
            return "900 " + sz + 'px "Arial Black",Impact,Arial,sans-serif';
          }
          o.font = font(fontPx);
          while (fontPx > 28 && o.measureText("HOTBOX").width > w * 0.92) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var gap = fontPx * 0.05;
          var blockH = fontPx * 2 + gap;
          var textTop = h * 0.36 - blockH * 0.5;
          var cx = w * 0.5;
          o.lineWidth = Math.max(4, fontPx * 0.12);
          o.strokeText("ORNG", cx, textTop);
          o.fillText("ORNG", cx, textTop);
          o.strokeText("HOTBOX", cx, textTop + fontPx + gap);
          o.fillText("HOTBOX", cx, textTop + fontPx + gap);

          var img = o.getImageData(0, 0, w, h);
          var d = img.data;
          var coverage = new Uint8Array(w * h);
          for (var i = 0, p = 0; i < coverage.length; i += 1, p += 4) {
            coverage[i] = d[p] > 40 ? 255 : 0;
          }

          var invW = 1 / Math.max(1, w - 1);
          var invH = 1 / Math.max(1, h - 1);
          var edgeSoftX = 0.1;
          var edgeSoftY = 0.14;
          var band = Math.max(3, (h / 50) | 0);

          for (var si = 0; si < Math.ceil(w / pitch) + 1; si += 1) {
            var x = (si * pitch + pitch * 0.5) | 0;
            if (x < 0 || x >= w) continue;
            var fadeX = edgeFade(x * invW, edgeSoftX);
            if (fadeX < 0.04) continue;

            for (var y0 = 0; y0 < h; y0 += band) {
              var fadeY = edgeFade((y0 + band * 0.5) * invH, edgeSoftY);
              var a = 0.9 * fadeX * fadeY;
              if (a < 0.03) continue;
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + a + ")";
              ctx.fillRect(x - ((thin / 2) | 0), y0, thin, Math.min(band + 1, h - y0));
            }

            var run = -1;
            function flush(yEnd) {
              if (run < 0) return;
              var yy = run;
              var hh = yEnd - yy;
              run = -1;
              if (hh < 2) return;
              var fy = edgeFade((yy + yEnd) * 0.5 * invH, edgeSoftY);
              var aa = fadeX * fy;
              if (aa < 0.05) return;
              ctx.fillStyle = "rgba(" + R + "," + G + "," + B + "," + aa + ")";
              ctx.fillRect(x - ((thick / 2) | 0), yy, thick, hh);
            }
            for (var y = 0; y < h; y += 1) {
              if (coverage[y * w + x] > 0) {
                if (run < 0) run = y;
              } else {
                flush(y);
              }
            }
            flush(h);
          }
        }

        paint();
        window.addEventListener("resize", paint);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
