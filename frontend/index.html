<!doctype html>
<html lang="uk" data-theme="dark" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ORNG LED CONTROL</title>
    <script>
      (function () {
        window.__ORNG_SPLASH_T0 = performance.now();
        try {
          var t = sessionStorage.getItem("orng-ui-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        background: #000000 !important;
        overflow: hidden !important;
      }
      html.splash-active #app {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        pointer-events: all;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
      }
      #boot-splash canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas id="boot-splash-canvas"></canvas>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var canvas = document.getElementById("boot-splash-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;
        var coverage = null;
        var stripW = 0;
        var cw = 0;
        var ch = 0;
        var raf = 0;
        var t0 = window.__ORNG_SPLASH_T0 || performance.now();
        var SCROLL = 0.28;
        var R = 255, G = 77, B = 0;

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }
        function edgeFade(t, soft) {
          t = Math.max(0, Math.min(1, t));
          return Math.min(smoothstep(0, soft, t), smoothstep(0, soft, 1 - t));
        }
        function font(sz) {
          return "900 " + sz + 'px "Arial Black",Impact,Arial,sans-serif';
        }
        function paintText(o, cx, h, maxTextW) {
          var fontPx = Math.min(maxTextW * 0.38, h * 0.14);
          o.font = font(fontPx);
          while (fontPx > 28 && o.measureText("HOTBOX").width > maxTextW) {
            fontPx -= 2;
            o.font = font(fontPx);
          }
          var gap = fontPx * 0.05;
          var blockH = fontPx * 2 + gap;
          var textTop = h * 0.36 - blockH * 0.5;
          o.lineWidth = Math.max(4, fontPx * 0.12);
          o.strokeText("ORNG", cx, textTop);
          o.fillText("ORNG", cx, textTop);
          o.strokeText("HOTBOX", cx, textTop + fontPx + gap);
          o.fillText("HOTBOX", cx, textTop + fontPx + gap);
        }
        function capsule(x, y, ww, hh) {
          var rad = Math.min(ww / 2, hh / 2);
          if (hh <= ww) {
            ctx.beginPath();
            ctx.arc(x + ww / 2, y + hh / 2, rad, 0, Math.PI * 2);
            ctx.fill();
            return;
          }
          ctx.beginPath();
          ctx.moveTo(x, y + rad);
          ctx.arc(x + ww / 2, y + rad, rad, Math.PI, 0);
          ctx.lineTo(x + ww, y + hh - rad);
          ctx.arc(x + ww / 2, y + hh - rad, rad, 0, Math.PI);
          ctx.closePath();
          ctx.fill();
        }
        function rebuild(w, h) {
          stripW = w * 2;
          var off = document.createElement("canvas");
          off.width = stripW;
          off.height = h;
          var o = off.getContext("2d", { willReadFrequently: true });
          if (!o) return null;
          o.fillStyle = "#000";
          o.fillRect(0, 0, stripW, h);
          o.fillStyle = "#fff";
          o.strokeStyle = "#fff";
          o.textAlign = "center";
          o.textBaseline = "top";
          o.lineJoin = "round";
          var maxTextW = w * 0.9;
          paintText(o, w * 0.5, h, maxTextW);
          paintText(o, w * 1.5, h, maxTextW);
          var img = o.getImageData(0, 0, stripW, h);
          var d = img.data;
          var cov = new Uint8Array(stripW * h);
          for (var i = 0, p = 0; i < cov.length; i += 1, p += 4) {
            cov[i] = d[p] > 40 ? 255 : 0;
          }
          return cov;
        }

        function paint(now) {
          if (!document.getElementById("boot-splash")) return;
          var w = Math.max(1, window.innerWidth | 0);
          var h = Math.max(1, window.innerHeight | 0);
          if (w !== cw || h !== ch || !coverage) {
            cw = w;
            ch = h;
            canvas.width = w;
            canvas.height = h;
            coverage = rebuild(w, h);
          }
          var timeSec = (now - t0) / 1000;
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);
          if (!coverage || w < 8) {
            raf = requestAnimationFrame(paint);
            return;
          }

          var pitch = Math.max(5, Math.min(14, Math.round(w / 70)));
          var thin = Math.max(1, Math.round(pitch * 0.18));
          var thick = Math.max(thin + 3, Math.round(pitch * 0.78));
          var invW = 1 / Math.max(1, w - 1);
          var invH = 1 / Math.max(1, h - 1);
          var scroll = ((timeSec * SCROLL * w) % w + w) % w;
          var band = Math.max(4, (h / 40) | 0);
          ctx.fillStyle = "rgb(" + R + "," + G + "," + B + ")";

          for (var si = 0; si < Math.ceil(w / pitch) + 1; si += 1) {
            var x = (si * pitch + pitch * 0.5) | 0;
            if (x < 0 || x >= w) continue;
            var fadeX = edgeFade(x * invW, 0.1);
            if (fadeX < 0.04) continue;
            var sampleX = (Math.floor(x + scroll) % stripW + stripW) % stripW;

            for (var y0 = 0; y0 < h; y0 += band) {
              var fadeY = edgeFade((y0 + band * 0.5) * invH, 0.14);
              var a = fadeX * fadeY;
              if (a < 0.05) continue;
              ctx.globalAlpha = a;
              ctx.fillRect(x - ((thin / 2) | 0), y0, thin, Math.min(band + 1, h - y0));
            }

            var run = -1;
            function flush(yEnd) {
              if (run < 0) return;
              var yy = run;
              var hh = yEnd - yy;
              run = -1;
              if (hh < 2) return;
              var fy = edgeFade((yy + yEnd) * 0.5 * invH, 0.14);
              var aa = fadeX * fy;
              if (aa < 0.05) return;
              ctx.globalAlpha = aa;
              capsule(x - ((thick / 2) | 0), yy, thick, hh);
            }
            for (var y = 0; y < h; y += 1) {
              if (coverage[y * stripW + sampleX] > 0) {
                if (run < 0) run = y;
              } else {
                flush(y);
              }
            }
            flush(h);
          }
          ctx.globalAlpha = 1;
          raf = requestAnimationFrame(paint);
        }

        raf = requestAnimationFrame(paint);
        window.addEventListener("resize", function () {
          cw = 0;
          ch = 0;
          coverage = null;
        });
        var obs = new MutationObserver(function () {
          if (!document.getElementById("boot-splash")) {
            cancelAnimationFrame(raf);
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
